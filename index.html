<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>小廚神食堂</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">

<script>
// 確保 <head> 裡的 viewport 也固定縮放（頁面外框自帶的 viewport 會被改成這個設定）
(function () {
  var want = 'width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover';
  var metas = document.querySelectorAll('meta[name="viewport"]');
  if (!metas.length) { var m = document.createElement('meta'); m.name = 'viewport'; document.head.appendChild(m); metas = [m]; }
  for (var i = 0; i < metas.length; i++) metas[i].setAttribute('content', want);
  var head = metas[0]; if (head.parentNode !== document.head) document.head.appendChild(head);
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&display=swap">
<style>
/* Layout: landscape 3:2 (iPad 橫放) top-down tabletop on one canvas; the wood table extends to fill any screen.
   Single deliberate look (warm wood + navy/indigo ceramics), no dark theme. */
:root{ --wood:#c99d63; --indigo:#1e2d57; --ink:#2a1c17; color-scheme:light;
  --font:'Huninn','PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif; }
html,body{height:100%;margin:0;overflow:hidden;background:var(--wood);color:var(--ink);font-family:var(--font);
  touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;
  -webkit-text-size-adjust:100%;text-size-adjust:100%}
/* 固定整個畫面：不捲動、不回彈、不縮放 */
html{position:fixed;inset:0;width:100%;height:100%}
body{position:fixed;inset:0;width:100%;height:100%;-webkit-overflow-scrolling:auto}
*,*::before,*::after{touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;-webkit-user-drag:none}

#stage{position:fixed;inset:0}
/* iPad 直放時提示轉成橫的 */

#stage{position:relative;width:100%;height:100%}

</style>
<div id="stage"><canvas id="cv" tabindex="0" aria-label="小廚神食堂：俯視桌面做沙拉"></canvas></div>
<div id="rotate" aria-label="請把 iPad 橫放"><svg viewBox="0 0 200 200" aria-hidden="true">
  <rect x="48" y="46" width="90" height="124" rx="14" fill="#fbf3e4" stroke="#fff" stroke-width="6" opacity=".45"/>
  <rect x="38" y="70" width="140" height="100" rx="14" fill="#fbf3e4" stroke="#fff" stroke-width="6"/>
  <circle cx="166" cy="120" r="5" fill="#c99d63"/>
  <path d="M40 60 A60 60 0 0 1 92 18" fill="none" stroke="#ffd34d" stroke-width="9" stroke-linecap="round"/>
  <path d="M80 6 L98 18 L82 32" fill="none" stroke="#ffd34d" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>

<script>
(() => {
'use strict';
const W = 1500, H = 1000, INK = '#2a1c17';
const FONT = "'Huninn','PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif";
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
let dpr = 1, scale = 1, ox = 0, oy = 0, cw = 0, ch = 0;

window.addEventListener('orientationchange', () => setTimeout(() => { window.scrollTo(0, 0); resize(); }, 250));
window.visualViewport && window.visualViewport.addEventListener('resize', () => { window.scrollTo(0, 0); });
function resize() {
  const r = cv.getBoundingClientRect();
  cw = r.width; ch = r.height;
  dpr = Math.min(window.devicePixelRatio || 1, 2.5);
  cv.width = Math.round(cw * dpr); cv.height = Math.round(ch * dpr);
  scale = Math.min(cw / W, ch / H);
  ox = (cw - W * scale) / 2; oy = (ch - H * scale) / 2;
}
addEventListener('resize', resize);

/* ---------- utils ---------- */
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const easeOutBack = t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
const easeInOut = t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
const pick = a => a[(Math.random() * a.length) | 0];
const hitCircle = (p, x, y, r) => (p.x - x) ** 2 + (p.y - y) ** 2 <= r * r;
function viewRect() { return { x: -ox / scale, y: -oy / scale, w: cw / scale, h: ch / scale }; }

function rr(c, x, y, w, h, r) {
  c.beginPath();
  if (c.roundRect) { c.roundRect(x, y, w, h, r); return; }
  r = Math.min(r, w / 2, h / 2);
  c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
}
function ink(c, fill, lw = 6) {
  if (fill) { c.fillStyle = fill; c.fill(); }
  c.lineWidth = lw * .38; c.strokeStyle = 'rgba(70,40,22,.5)'; c.lineJoin = 'round'; c.lineCap = 'round'; c.stroke();
}
function circle(c, x, y, r) { c.beginPath(); c.arc(x, y, Math.max(0.1, r), 0, Math.PI * 2); }
function ell(c, x, y, rx, ry, rot = 0) { c.beginPath(); c.ellipse(x, y, Math.max(.1, rx), Math.max(.1, ry), rot, 0, Math.PI * 2); }
function sparkPath(c, s) {
  c.beginPath(); c.moveTo(0, -s); c.quadraticCurveTo(0, 0, s, 0); c.quadraticCurveTo(0, 0, 0, s);
  c.quadraticCurveTo(0, 0, -s, 0); c.quadraticCurveTo(0, 0, 0, -s); c.closePath();
}
function starPath(c, r, inner = .46) {
  c.beginPath();
  for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, q = i % 2 ? r * inner : r; c.lineTo(Math.cos(a) * q, Math.sin(a) * q); }
  c.closePath();
}
function heartPath(c, s) {
  c.beginPath(); c.moveTo(0, s);
  c.bezierCurveTo(-s * 1.3, 0, -s * .6, -s * 1.1, 0, -s * .35);
  c.bezierCurveTo(s * .6, -s * 1.1, s * 1.3, 0, 0, s); c.closePath();
}
function txt(c, s, x, y, size, fill = '#fff', stroke = null, sw = 10, align = 'center') {
  c.font = `${size}px ${FONT}`; c.textAlign = align; c.textBaseline = 'middle';
  if (stroke) { c.lineJoin = 'round'; c.lineWidth = sw; c.strokeStyle = stroke; c.strokeText(s, x, y); }
  c.fillStyle = fill; c.fillText(s, x, y);
}

/* ---------- Audio (WebAudio 合成 ASMR 音效) ---------- */
const SFX = {
  ac: null, muted: false, master: null, loops: {}, lastDrop: 0,
  init() {
    if (this.ac) { if (this.ac.state === 'suspended') this.ac.resume(); return; }
    try {
      const AC = window.AudioContext || window.webkitAudioContext; this.ac = new AC();
      this.master = this.ac.createGain(); this.master.gain.value = this.muted ? 0 : .7; this.master.connect(this.ac.destination);
      const len = this.ac.sampleRate, b = this.ac.createBuffer(1, len, this.ac.sampleRate), d = b.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      this.noiseBuf = b;
      this.loops.sauce = this.makeLoop('bandpass', 650, 1.4);
      this.loops.swirl = this.makeLoop('lowpass', 500, .8);
    } catch (e) { this.ac = null; }
  },
  makeLoop(type, f, q) {
    const s = this.ac.createBufferSource(); s.buffer = this.noiseBuf; s.loop = true;
    const fl = this.ac.createBiquadFilter(); fl.type = type; fl.frequency.value = f; fl.Q.value = q;
    const g = this.ac.createGain(); g.gain.value = 0;
    s.connect(fl); fl.connect(g); g.connect(this.master); s.start(); return { g, fl };
  },
  setLoop(name, vol, freq) {
    const L = this.loops[name]; if (!L) return; const t = this.ac.currentTime;
    L.g.gain.setTargetAtTime(vol, t, .06); if (freq) L.fl.frequency.setTargetAtTime(freq, t, .06);
  },
  setMuted(m) { this.muted = m; if (this.master) this.master.gain.setTargetAtTime(m ? 0 : .7, this.ac.currentTime, .02); },
  tone(f1, f2, dur, type = 'sine', vol = .3, delay = 0) {
    if (!this.ac) return; const t = this.ac.currentTime + delay;
    const o = this.ac.createOscillator(), g = this.ac.createGain(); o.type = type;
    o.frequency.setValueAtTime(f1, t); o.frequency.exponentialRampToValueAtTime(Math.max(20, f2), t + dur);
    g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + .01); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(g); g.connect(this.master); o.start(t); o.stop(t + dur + .05);
  },
  noise(dur, type, freq, q, vol, delay = 0) {
    if (!this.ac) return; const t = this.ac.currentTime + delay;
    const s = this.ac.createBufferSource(); s.buffer = this.noiseBuf;
    const f = this.ac.createBiquadFilter(); f.type = type; f.frequency.value = freq; f.Q.value = q;
    const g = this.ac.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(this.master); s.start(t, Math.random() * .5); s.stop(t + dur + .02);
  },
  chop() { this.noise(.045, 'highpass', 3200, .7, .7); this.noise(.08, 'bandpass', 1900, 2.5, .5, .012); this.tone(170, 60, .12, 'sine', .55); },
  pop() { this.tone(320, 950, .11, 'sine', .32); },
  drop() { const n = performance.now(); if (n - this.lastDrop < 70) return; this.lastDrop = n; this.tone(rand(600, 800), 230, .14, 'triangle', .18); },
  ding() { [784, 988, 1175].forEach((f, i) => this.tone(f, f, .35, 'sine', .22, i * .09)); },
  sparkle() { for (let i = 0; i < 4; i++) this.tone(1500 + i * 300, 1800 + i * 300, .12, 'sine', .07, i * .05); },
  boop() { this.tone(260, 190, .16, 'square', .07); },
  chomp() { this.noise(.07, 'lowpass', 900, 1, .6); this.tone(230, 120, .1, 'sine', .3, .02); this.noise(.05, 'lowpass', 700, 1, .4, .14); },
  whoosh() { this.noise(.32, 'bandpass', 900, .8, .22); },
  fanfare() { [523, 659, 784, 1047].forEach((f, i) => this.tone(f, f * 1.01, .32, 'triangle', .2, i * .12)); },
  react(kind) {
    if (kind === 'spicy') { this.tone(500, 1400, .5, 'sawtooth', .07); this.noise(.6, 'highpass', 2500, .5, .15, .1); }
    else if (kind === 'weird') { this.tone(300, 600, .25, 'sine', .2); this.tone(600, 250, .3, 'sine', .2, .25); }
    else if (kind === 'sweet') { [880, 1100, 1320, 1760].forEach((f, i) => this.tone(f, f, .25, 'sine', .14, i * .07)); }
    else { this.tone(520, 880, .18, 'sine', .22); this.tone(660, 1100, .2, 'sine', .2, .16); }
  }
};

/* ---------- Object Pools ---------- */
const PARTS = Array.from({ length: 420 }, () => ({ on: false }));
function emit(type, x, y, o = {}) {
  for (const p of PARTS) if (!p.on) {
    p.on = true; p.type = type; p.x = x; p.y = y;
    p.vx = o.vx ?? rand(-220, 220); p.vy = o.vy ?? rand(-320, -60); p.g = o.g ?? 500;
    p.life = 0; p.max = o.max ?? rand(.6, 1.1); p.size = o.size ?? rand(10, 22);
    p.rot = rand(0, 6.28); p.vr = o.vr ?? rand(-4, 4); p.color = o.color ?? '#fff';
    return p;
  }
  return null;
}
function burst(x, y, n, colors = ['#fff', '#fff6b0', '#ffe066']) {
  n = reduced ? Math.ceil(n / 3) : n;
  for (let i = 0; i < n; i++) emit('spark', x, y, { color: pick(colors), vx: rand(-320, 320), vy: rand(-380, 80), g: 300, size: rand(10, 24), max: rand(.4, .8) });
}
const CHUNK_POOL = [];
for (let i = 0; i < 64; i++) CHUNK_POOL.push({});
const acquireChunk = () => CHUNK_POOL.pop() || {};
const releaseChunk = c => { c.fly = null; CHUNK_POOL.push(c); };

/* ---------- 食材 Ingredients (art + tags) ---------- */
function lwFor(r) { return Math.max(2.6, r * .055); }
function drawTomato(c, r) {
  ell(c, 0, 0, r * 1.05, r * .95); ink(c, '#ee4b36', lwFor(r));
  ell(c, -r * .42, -r * .4, r * .26, r * .14, -.6); c.fillStyle = 'rgba(255,255,255,.5)'; c.fill();
  c.beginPath();
  for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, q = i % 2 ? r * .13 : r * .4; c.lineTo(Math.cos(a) * q, -r * .8 + Math.sin(a) * q * .55); }
  c.closePath(); ink(c, '#5cc93d', lwFor(r) * .85);
  rr(c, -r * .06, -r * 1.12, r * .12, r * .3, r * .06); ink(c, '#4aa832', lwFor(r) * .8);
}
function sliceTomato(c, r) {
  circle(c, 0, 0, r); ink(c, '#e8442f', lwFor(r));
  circle(c, 0, 0, r * .8); c.fillStyle = '#f26b55'; c.fill();
  c.strokeStyle = '#f9a493'; c.lineWidth = r * .07;
  for (let i = 0; i < 6; i++) { const a = (i + .5) / 6 * Math.PI * 2; c.beginPath(); c.moveTo(Math.cos(a) * r * .3, Math.sin(a) * r * .3); c.lineTo(Math.cos(a) * r * .78, Math.sin(a) * r * .78); c.stroke(); }
  ell(c, 0, 0, r * .3, r * .25); c.fillStyle = '#f9a493'; c.fill();
  c.fillStyle = '#ffd86b';
  for (let i = 0; i < 6; i++) { const a = i / 6 * Math.PI * 2; ell(c, Math.cos(a) * r * .55, Math.sin(a) * r * .55, r * .07, r * .12, a + Math.PI / 2); c.fill(); }
}
function drawCucumber(c, r) {
  c.save(); c.rotate(-.25);
  rr(c, -r * 1.35, -r * .5, r * 2.7, r, r * .5); ink(c, '#4bb03b', lwFor(r));
  rr(c, -r * 1.1, -r * .32, r * 2, r * .15, r * .08); c.fillStyle = 'rgba(255,255,255,.35)'; c.fill();
  c.fillStyle = '#2f7d25';
  for (let i = 0; i < 7; i++) { circle(c, -r * .95 + i * r * .32, (i % 2 ? .18 : -.05) * r, r * .05); c.fill(); }
  c.restore();
}
function sliceCucumber(c, r) {
  circle(c, 0, 0, r * .88); ink(c, '#3b9a2e', lwFor(r));
  circle(c, 0, 0, r * .72); c.fillStyle = '#e6f8b8'; c.fill();
  circle(c, 0, 0, r * .4); c.fillStyle = '#cdeb93'; c.fill();
  c.fillStyle = '#fffbe0';
  for (let i = 0; i < 3; i++) { const a = i / 3 * Math.PI * 2 - Math.PI / 2; ell(c, Math.cos(a) * r * .2, Math.sin(a) * r * .2, r * .06, r * .11, a + Math.PI / 2); c.fill(); }
}
function drawOnion(c, r) {
  c.beginPath(); c.moveTo(0, -r * 1.05);
  c.bezierCurveTo(r * .15, -r * .7, r * 1.02, -r * .45, r * .96, r * .2);
  c.bezierCurveTo(r * .9, r * .85, -r * .9, r * .85, -r * .96, r * .2);
  c.bezierCurveTo(-r * 1.02, -r * .45, -r * .15, -r * .7, 0, -r * 1.05); c.closePath();
  ink(c, '#b26ad8', lwFor(r));
  c.strokeStyle = '#dcaaf2'; c.lineWidth = r * .06;
  [-.45, 0, .45].forEach(k => { c.beginPath(); c.moveTo(0, -r * .85); c.quadraticCurveTo(k * r * 1.6, -r * .1, k * r * .7, r * .62); c.stroke(); });
  c.strokeStyle = INK; c.lineWidth = lwFor(r) * .7;
  [-.15, 0, .15].forEach(k => { c.beginPath(); c.moveTo(k * r, r * .72); c.lineTo(k * r * 1.5, r * .92); c.stroke(); });
}
function sliceOnion(c, r) {
  circle(c, 0, 0, r * .92); ink(c, '#fbf2ff', lwFor(r));
  c.strokeStyle = '#c18ae2';
  [.74, .52, .3].forEach(k => { c.lineWidth = r * .08; circle(c, 0, 0, r * k); c.stroke(); });
  c.strokeStyle = '#a65fcf'; c.lineWidth = r * .1; circle(c, 0, 0, r * .86); c.stroke();
}
function drawWatermelon(c, r) {
  const R = r * 1.08;
  circle(c, 0, 0, R); ink(c, '#4fbf4a', lwFor(r));
  c.save(); circle(c, 0, 0, R - 2); c.clip();
  c.strokeStyle = '#23852f'; c.lineWidth = r * .13; c.lineJoin = 'round';
  for (let k = -3; k <= 3; k++) {
    c.beginPath();
    for (let j = 0; j <= 12; j++) {
      const y = -R + j * R / 6, w = Math.sqrt(Math.max(0, 1 - (y / R) ** 2));
      c.lineTo(k * R * .3 * w + (j % 2 ? r * .07 : -r * .07) * w, y);
    }
    c.stroke();
  }
  c.restore();
  ell(c, -R * .42, -R * .45, R * .26, R * .12, -.6); c.fillStyle = 'rgba(255,255,255,.45)'; c.fill();
  c.beginPath(); c.moveTo(0, -R + 2); c.quadraticCurveTo(r * .08, -R - r * .16, r * .2, -R - r * .2); c.lineWidth = lwFor(r) * 1.4; c.strokeStyle = INK; c.lineCap = 'round'; c.stroke();
  c.lineWidth = lwFor(r) * .6; c.strokeStyle = '#6fd04a'; c.stroke();
}
function sliceWatermelon(c, r) {
  circle(c, 0, 0, r); ink(c, '#3fae4a', lwFor(r));
  circle(c, 0, 0, r * .86); c.fillStyle = '#fbfbe6'; c.fill();
  circle(c, 0, 0, r * .76); c.fillStyle = '#ff5866'; c.fill();
  circle(c, 0, 0, r * .3); c.fillStyle = '#ff7a85'; c.fill();
  c.fillStyle = INK;
  for (let i = 0; i < 8; i++) { const a = i / 8 * Math.PI * 2; ell(c, Math.cos(a) * r * .5, Math.sin(a) * r * .5, r * .05, r * .09, a + Math.PI / 2); c.fill(); }
}
function drawKiwi(c, r) {
  ell(c, 0, 0, r * 1.15, r * .88); ink(c, '#a0703f', lwFor(r));
  c.strokeStyle = '#7a4f2a'; c.lineWidth = r * .04;
  for (let i = 0; i < 18; i++) { const a = i * 2.4, q = (i % 5) / 5 * .7; const x = Math.cos(a) * r * q * 1.1, y = Math.sin(a) * r * q * .8; c.beginPath(); c.moveTo(x, y); c.lineTo(x + r * .06, y - r * .05); c.stroke(); }
  ell(c, -r * .45, -r * .4, r * .25, r * .1, -.4); c.fillStyle = 'rgba(255,255,255,.3)'; c.fill();
}
function sliceKiwi(c, r) {
  circle(c, 0, 0, r); ink(c, '#8a5a32', lwFor(r));
  circle(c, 0, 0, r * .86); c.fillStyle = '#7ccc3f'; c.fill();
  c.strokeStyle = '#a8e06a'; c.lineWidth = r * .05;
  for (let i = 0; i < 14; i++) { const a = i / 14 * Math.PI * 2; c.beginPath(); c.moveTo(Math.cos(a) * r * .3, Math.sin(a) * r * .3); c.lineTo(Math.cos(a) * r * .78, Math.sin(a) * r * .78); c.stroke(); }
  ell(c, 0, 0, r * .28, r * .24); c.fillStyle = '#f2fbd4'; c.fill();
  c.fillStyle = INK;
  for (let i = 0; i < 12; i++) { const a = i / 12 * Math.PI * 2; ell(c, Math.cos(a) * r * .42, Math.sin(a) * r * .42, r * .035, r * .07, a); c.fill(); }
}
function berryPath(c, r) {
  c.beginPath(); c.moveTo(0, r * .98);
  c.bezierCurveTo(-r * .5, r * .72, -r * 1.02, 0, -r * .86, -r * .45);
  c.bezierCurveTo(-r * .7, -r * .86, r * .7, -r * .86, r * .86, -r * .45);
  c.bezierCurveTo(r * 1.02, 0, r * .5, r * .72, 0, r * .98); c.closePath();
}
function drawStrawberry(c, r) {

  { react: 'yummy' }
];
const REACTIONS = {
  yummy: { title: '超級美味！', eyes: 'happy', mouth: 'smile', tint: null, fx: 'hearts' },
  sweet: { title: '甜蜜蜜～', eyes: 'stars', mouth: 'smile', tint: null, fx: 'stars' },

function judge(run) {
  const tags = {}, add = (t, w) => tags[t] = (tags[t] || 0) + w;
  run.ingredients.forEach(k => ING[k].tags.forEach(t => add(t, 1)));
  const tot = Object.values(run.sauce).reduce((a, b) => a + b, 0) || 1;
  SAUCES.forEach(s => { const share = (run.sauce[s.id] || 0) / tot; if (share > .15) s.tags.forEach(t => add(t, share * 2)); });
  for (const r of RULES) {
    if ((r.all || []).every(t => tags[t]) && (!r.any || r.any.some(t => tags[t])) && !(r.none || []).some(t => tags[t])) return { react: r.react, tags };
  }
  return { react: 'yummy', tags };
}

/* ---------- 碗內食物：俯視堆成小山 ---------- */
const PILE_SLOTS = (() => {
  const pts = [], SP = 58; let seed = 11; const rnd = (a, b) => { seed = (seed * 9301 + 49297) % 233280; return a + seed / 233280 * (b - a); };
  for (let layer = 0; layer < 9; layer++) {
    const R = BOWL.PILE * Math.max(.12, 1 - layer * .2); let n = 0;
    for (let row = 0, y = -R; y <= R + .1; y += SP * .86, row++)
      for (let x = -R - SP + ((row + layer) % 2) * SP / 2; x <= R + SP; x += SP)
        if (x * x + y * y <= R * R * 1.02) { n++; pts.push({ x: x + rnd(-7, 7), y: y + rnd(-7, 7), layer, pri: Math.hypot(x, y) / BOWL.PILE * 1.1 + layer * .42 + rnd(0, .06) }); }
    if (!n) pts.push({ x: rnd(-5, 5), y: rnd(-5, 5), layer, pri: layer * .42 });
  }
  return pts.sort((a, b) => a.pri - b.pri);
})();
function setSlot(ch, i) { const s = PILE_SLOTS[Math.min(i, PILE_SLOTS.length - 1)]; ch.tx = BOWL.x + s.x; ch.ty = BOWL.y + s.y; ch.layer = s.layer; }
function tidyAll() { const order = S.chunks.map((_, i) => i).sort(() => Math.random() - .5); S.chunks.forEach((c, i) => { setSlot(c, order[i]); c.rt = rand(-3, 3); c.tidy = true; }); }
function drawPileChunk(c, ch) {
  let x = ch.x, y = ch.y, s = 1 + Math.min(ch.layer || 0, 3) * .05;
  if (ch.fly) {
    const e = easeInOut(clamp(ch.fly.t / ch.fly.dur, 0, 1));
    x = lerp(ch.fly.sx, ch.tx, e); y = lerp(ch.fly.sy, ch.ty, e) - Math.sin(Math.PI * e) * ch.fly.arc; s = lerp(ch.fly.s0, s, e) * (1 + Math.sin(Math.PI * e) * .25);
  }
  const sq = ch.squash || 0;
  drawSprite(c, ch.key, 's', 32, x, y - (ch.layer || 0) * 3, ch.rot, s * (1 + sq * .14), ch.fly ? 1.8 : Math.min(1.05, .75 + (ch.layer || 0) * .06));

// 客人圖片（使用者提供的貓娘圖，去背後切成三位）
const GIMG = GIMG_DATA.map(d => { const img = new Image(); img.src = d.src; return { ...d, img }; });
const IMG_K = .39 / .6;     // 存檔時縮成 0.6 倍，畫面上以原圖 0.39 倍顯示
const MOUTH_Y = 412, HEART_Y = 124, GSC = .86, TABLE_Y = 590, DYT = TABLE_Y - 676;
function drawGuest(c, g, face) {
  const gi = GIMG[g.i];
  if (!gi.img.complete || !gi.img.naturalWidth) { drawCatgirl(c, ['bob', 'twin', 'pony'][g.i], g.x, HEAD_Y, GS, face); return; }
  const t = G.t, jump = g.happy > 0 ? Math.abs(Math.sin(g.happy * 8)) * 16 * Math.min(1, g.happy) : 0;
  const chewS = g.chew > 0 ? Math.sin(t * 22) * .012 : 0;
  c.save(); c.translate(g.x, MOUTH_Y + Math.sin(t * 2 + g.bob) * 3 - jump);
  c.scale(GSC * (1 + chewS), GSC * (1 - chewS));
  sh(c, 16, 0, 8, .22);
  const kk = gi.k * (g.i === 1 ? .88 : 1); c.drawImage(gi.img, -gi.mx * kk, -gi.my * kk, gi.img.naturalWidth * kk, gi.img.naturalHeight * kk); noSh(c);
  c.scale(.8, .8);
  const m = face.mouth;
  if (m === 'open' || m === 'chew') {
    ell(c, 0, 0, 24, 13); c.fillStyle = gi.skin; c.fill();
    if (m === 'open' || Math.sin(t * 22) > 0) { ell(c, 0, 2, 10, m === 'open' ? 9 : 5); c.fillStyle = '#9a2f3c'; c.fill(); if (m === 'open') { ell(c, 0, 7, 6, 3); c.fillStyle = '#f47a8a'; c.fill(); } }
    else { c.beginPath(); c.arc(-5, -1, 5, .1 * Math.PI, .9 * Math.PI); c.arc(5, -1, 5, .1 * Math.PI, .9 * Math.PI); c.lineWidth = 2.4; c.strokeStyle = '#6a2a2a'; c.lineCap = 'round'; c.stroke(); }
  }
  if (g.happy > 0 || g.full >= FULL) { c.globalAlpha = .35; c.fillStyle = '#ff7a9a'; ell(c, -52, -16, 20, 9); c.fill(); ell(c, 52, -16, 20, 9); c.fill(); c.globalAlpha = 1; }
  if (face.eyes === 'stars') { for (let i = 0; i < 2; i++) { c.save(); c.translate((i ? 1 : -1) * 70, -90 + Math.sin(t * 6 + i) * 4); c.rotate(t * 2); sparkPath(c, 10); c.fillStyle = '#fff6b0'; c.fill(); c.restore(); } }
  c.restore();
}
function drawGuestMini(c, g, x, y) {
  const gi = GIMG[g.i]; if (!gi.img.complete || !gi.img.naturalWidth) { drawCatgirl(c, ['bob', 'twin', 'pony'][g.i], x, y, .42, { eyes: 'happy', mouth: 'smile', t: G.t }); return; }
  c.save(); circle(c, x, y, 78); c.fillStyle = '#fff'; c.fill(); c.clip();
  const k = gi.k * .62; c.drawImage(gi.img, x - gi.mx * k, y + 26 - gi.my * k, gi.img.naturalWidth * k, gi.img.naturalHeight * k);
